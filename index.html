<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#091a26">
<title>Reeflight Aquarium</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui,sans-serif; color: #eef9f2; background: #091a26; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  #game { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0,1fr); overflow: hidden; background: #092a39; }
  .dash { z-index: 1; display: flex; align-items: stretch; flex-wrap: wrap; gap: 6px; padding: 9px; background: #0d222f; border-bottom: 2px solid #5b8190; }
  button { color: inherit; font: inherit; cursor: pointer; border: 1px solid #3c6575; background: #132f3d; border-radius: 8px; }
  button:hover:not(:disabled) { background: #245165; }
  button:focus-visible, canvas:focus-visible { outline: 2px solid #b7f9e0; outline-offset: -3px; }
  button:disabled { cursor: default; opacity: .58; }
  .item { display: grid; justify-items: start; grid-template-columns: auto 1fr; column-gap: 8px; align-content: center; padding: 6px 10px; text-align: left; }
  .item .icon { grid-row: span 2; align-self: center; color: #ffd58c; font-size: 23px; line-height: 1; min-width: 24px; text-align: center; }
  .item strong { font-size: 13px; }
  .item small, .balance small { font-size: 12px; color: #b9d5dc; }
  .balance { display: grid; align-content: center; min-width: 82px; padding: 4px 10px; background: #09222a; border: 1px solid #447d7b; border-radius: 8px; }
  .balance output { color: #ffe29b; font-size: clamp(18px,3.2vw,28px); font-weight: 750; line-height: 1.05; }
  .utility { display: flex; gap: 6px; margin-left: auto; }
  .utility button { padding: 5px 9px; font-size: 13px; }
  .tank { position: relative; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: manipulation; }
  .tank-notes { position: absolute; inset: 12px 12px auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px; pointer-events: none; }
  .tank-notes p, #status { padding: 6px 10px; margin: 0; font-size: 13px; border-radius: 7px; background: #091a26e8; color: #d6ebe8; }
  #raid[data-alert], #status[data-error] { color: #ffda92; }
  #status { position: absolute; bottom: 12px; left: 12px; right: auto; max-width: calc(100% - 24px); pointer-events: none; }
  #lost { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%,-50%); width: min(290px,90%); padding: 20px; text-align: center; border: 1px solid #72929a; background: #0d222ff5; border-radius: 12px; }
  #lost p { margin: 0 0 12px; }
  #lost button { padding: 8px 12px; }
  @media (max-width: 640px) {
    .dash { gap: 4px; padding: 5px; }
    .item { padding: 5px 6px; column-gap: 4px; }
    .item .icon { font-size: 17px; min-width: 16px; }
    .tank-notes p, #status { font-size: 11px; }
  }
</style>
<main id="game" aria-label="Reeflight Aquarium">
  <header class="dash" aria-label="Aquarium shop">
    <div class="balance"><small>Cash</small><output id="cash">$80</output></div>
    <button class="item" id="buy" type="button"><span class="icon" aria-hidden="true">?</span><strong>Buy fish</strong><small>$40</small></button>
    <button class="item" id="upgrade" type="button"><span class="icon" id="food-icon" aria-hidden="true">?</span><strong>Upgrade food</strong><small id="upgrade-info">$32</small></button>
    <button class="item" id="gun" type="button" title="Click the alien to shoot it, or use this button"><span class="icon" aria-hidden="true">?</span><strong>Fire blaster</strong><small id="gun-info">Standby</small></button>
    <div class="utility">
      <button id="save" type="button">Save</button>
      <button id="fullscreen" type="button">Full screen</button>
    </div>
  </header>
  <section class="tank" aria-label="Aquarium">
    <canvas id="tank" width="960" height="490" tabindex="0" aria-label="Aquarium playfield" aria-describedby="controls"></canvas>
    <div class="tank-notes">
      <p id="controls">Click water to feed � Click coins to collect</p>
      <p id="raid" role="status">Tank clear</p>
    </div>
    <div id="lost" hidden><p role="status">All fish were lost.</p><button id="restart" type="button">Start a new tank</button></div>
    <p id="status" role="status">Autosave on</p>
  </section>
</main>
<script type="module">
  const SAVE_KEY = 'reeflight-aquarium-v1';
  const WIDTH = 960, HEIGHT = 490;
  const MAX_CASH = 999999, MAX_FISH = 12, MAX_FOOD = 6, BUY_FISH = 40;
  const COIN_LIFETIME = 11, FIRST_RAID = 48, RAID_WARNING = 8, SHOT_COOLDOWN = .24;
  const FOOD = [
    {label:'Pellet', cash:3, upgrade:32, energy:38, growth:14, shape:'?', color:'#e6a374'},
    {label:'Flake', cash:4, upgrade:65, energy:56, growth:21, shape:'?', color:'#7ff0d8'},
    {label:'Cube', cash:5, upgrade:null, energy:74, growth:29, shape:'�', color:'#d9a9fc'}
  ];
  const ids = ['game','tank','cash','buy','upgrade','upgrade-info','food-icon','gun','gun-info',
    'save','fullscreen','controls','raid','status','lost','restart'];
  const ui = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const ctx = ui.tank.getContext('2d');
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const distance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
  const effects = [];
  const fishColors = ['#f5a771','#82dfcb','#caabf5'];
  const bubbles = Array.from({length:42}, (_,i) => ({x:25 + i*131%900,y:i*77%480,size:1 + i%5}));
  let lastSaved = null, savePaused = false, animationTime = 0, untilSave = 5;

  function makeFish(kind,timer) {
    return {kind, x:160+Math.random()*640, y:135+Math.random()*180, energy:78, health:100, growth:12,
      direction:kind===1?-1:1, timer, phase:Math.random()*6.28};
  }

  function freshTank() {
    return {version:3, cash:80, foodLevel:0, elapsed:0, nextRaid:FIRST_RAID, raidsCleared:0, shotReady:0,
      alien:null, fish:[makeFish(0,5),makeFish(1,9)], coins:[], pellets:[]};
  }

  const range = (v,min,max) => Number.isFinite(v) && v>=min && v<=max;
  const integer = (v,min,max) => Number.isInteger(v) && range(v,min,max);
  const position = o => o && range(o.x,38,922) && range(o.y,52,445);

  function validFish(f) {
    return position(f) && integer(f.kind,0,2) && range(f.energy,0,100) && range(f.growth,0,100)
      && range(f.phase,0,6.28) && range(f.timer,0,22) && (f.direction===1 || f.direction===-1);
  }

  function validTank(s) {
    return s?.version===3 && integer(s.cash,0,MAX_CASH) && integer(s.foodLevel,0,2)
      && range(s.elapsed,0,Number.MAX_SAFE_INTEGER) && range(s.nextRaid,0,Number.MAX_SAFE_INTEGER)
      && integer(s.raidsCleared,0,Number.MAX_SAFE_INTEGER) && range(s.shotReady,0,SHOT_COOLDOWN)
      && Array.isArray(s.fish) && s.fish.length<=MAX_FISH
      && s.fish.every(f => validFish(f) && range(f.health,0,100) && f.health>0)
      && Array.isArray(s.coins) && s.coins.length<=32 && s.coins.every(c =>
        position(c) && integer(c.value,1,50) && range(c.age,0,COIN_LIFETIME))
      && Array.isArray(s.pellets) && s.pellets.length<=MAX_FOOD && s.pellets.every(p =>
        position(p) && integer(p.level,0,2) && range(p.age,0,14))
      && (s.alien===null || (position(s.alien) && integer(s.alien.hp,1,9)
        && integer(s.alien.maxHp,s.alien.hp,9) && range(s.alien.biteReady,0,5)));
  }

  function migrate(s) {
    if ((s?.version!==1 && s?.version!==2) || !integer(s.balance,0,MAX_CASH)
      || !Array.isArray(s.fish) || s.fish.length>MAX_FISH || !s.fish.every(validFish)
      || !Array.isArray(s.pearls) || s.pearls.length>32
      || !s.pearls.every(p => position(p) && integer(p.value,1,50))) return null;
    return {...freshTank(), cash:s.balance, fish:s.fish.map(f =>
      ({...f,health:range(f.health,0,100) && f.health>0?f.health:100})),
      foodLevel:s.round?.feedUpgraded===true?1:0, coins:s.pearls.map(p => ({x:p.x,y:p.y,value:p.value,age:0}))};
  }

  function status(message,error=false) {
    if (ui.status.textContent!==message) ui.status.textContent=message;
    ui.status.toggleAttribute('data-error',error);
  }

  function load() {
    try {
      lastSaved=localStorage.getItem(SAVE_KEY);
      if (lastSaved!==null) {
        const raw=JSON.parse(lastSaved);
        const saved=raw?.version===3?raw:migrate(raw);
        if (!validTank(saved)) throw new Error('Invalid save');
        status(raw.version===3?'Saved tank loaded.':'Fish, cash and food upgrade carried over.');
        return saved;
      }
    } catch {
      savePaused=true;
      status('Save unavailable. Select Save to try saving this tank.',true);
    }
    return freshTank();
  }

  let state=load();

  function save(manual=false) {
    if (savePaused && !manual) return;
    try {
      if (localStorage.getItem(SAVE_KEY)!==lastSaved) {
        savePaused=true;
        status('Another tab saved this tank. Reload to continue from that save.',true);
        return;
      }
      const snapshot=JSON.stringify(state);
      localStorage.setItem(SAVE_KEY,snapshot);
      lastSaved=snapshot;
      savePaused=false;
      if (manual) status('Tank saved.');
    } catch {
      savePaused=true;
      status('Could not save the tank in this browser.',true);
    }
  }

  function say(message) {
    if (!savePaused) status(message);
  }

  function refreshRaid() {
    const seconds=Math.max(0,Math.ceil(state.nextRaid-state.elapsed));
    const underAttack=Boolean(state.alien && state.fish.length);
    const warning=state.fish.length>0 && seconds<=RAID_WARNING;
    const label=underAttack?'Alien in tank � click it to fire':warning?'Alien arriving in '+seconds+' s':'Tank clear';
    if (ui.raid.textContent!==label) ui.raid.textContent=label;
    ui.raid.toggleAttribute('data-alert',underAttack || warning);
    ui.gun.disabled=!underAttack || state.shotReady>0;
    const gunText=underAttack?state.alien.hp+' hits left':'Standby';
    if (ui['gun-info'].textContent!==gunText) ui['gun-info'].textContent=gunText;
  }

  function refresh() {
    const food=FOOD[state.foodLevel];
    const lost=state.fish.length===0;
    ui.cash.textContent='$'+state.cash.toLocaleString('en-US');
    ui.buy.disabled=lost || state.cash<BUY_FISH || state.fish.length>=MAX_FISH;
    ui.upgrade.disabled=lost || food.upgrade===null || state.cash<food.upgrade;
    ui['food-icon'].textContent=food.shape;
    ui['food-icon'].style.color=food.color;
    ui['upgrade-info'].textContent=food.upgrade===null?food.label+' � Max':food.label+' � $'+food.upgrade;
    ui.controls.textContent='Feed $'+food.cash+' � Click coins to collect';
    ui.lost.hidden=!lost;
    ui.tank.style.cursor=state.alien&&!lost?'crosshair':lost?'default':'pointer';
    refreshRaid();
  }

  function dropFood(x,y) {
    if (!state.fish.length || state.pellets.length>=MAX_FOOD) return;
    const cost=FOOD[state.foodLevel].cash;
    if (state.cash<cost) {say('Not enough cash for food. Collect a coin first.');return;}
    state.cash-=cost;
    state.pellets.push({x:clamp(x,38,922),y:clamp(y,52,420),age:0,level:state.foodLevel});
    effects.push({type:'label',x,y,text:'-$'+cost,color:'#f6b692',age:0});
    refresh();
    save();
  }

  function reward(amount,x,y) {
    state.cash=Math.min(MAX_CASH,state.cash+amount);
    effects.push({type:'label',x,y,text:'+$'+amount,color:'#ffe5a0',age:0});
  }

  function collect(index) {
    if (!state.fish.length || index<0) return;
    const [coin]=state.coins.splice(index,1);
    if (!coin) return;
    reward(coin.value,coin.x,coin.y);
    refresh();
    save();
  }

  function hurt(fish,amount) {
    fish.health-=amount;
    if (fish.health>0) return false;
    state.fish.splice(state.fish.indexOf(fish),1);
    say(state.fish.length?'A fish was lost.':'The tank is empty.');
    refresh();
    return true;
  }

  function runAlien(dt) {
    if (!state.alien && state.elapsed>=state.nextRaid) {
      const hp=Math.min(9,5+state.raidsCleared);
      state.alien={x:866,y:200,hp,maxHp:hp,biteReady:4};
      refresh();
      say('Alien sighted. Click it to fire the blaster.');
      save();
    }
    const alien=state.alien;
    if (!alien) return;
    alien.biteReady=Math.max(0,alien.biteReady-dt);
    const target=state.fish.reduce((nearest,fish) => distance(alien,fish)<distance(alien,nearest)?fish:nearest);
    const gap=distance(target,alien);
    if (gap>25) {
      const ratio=Math.min(1,66*dt/gap);
      alien.x=clamp(alien.x+(target.x-alien.x)*ratio,38,922);
      alien.y=clamp(alien.y+(target.y-alien.y)*ratio,52,445);
    }
    if (alien.biteReady===0 && gap<=48) {
      alien.biteReady=3.5;
      if (hurt(target,50)) save();
    }
  }

  function fire() {
    const alien=state.alien;
    if (!alien || state.shotReady>0 || !state.fish.length) return;
    state.shotReady=SHOT_COOLDOWN;
    alien.hp--;
    effects.push({type:'shot',x:alien.x,y:alien.y,age:0});
    if (alien.hp===0) {
      reward(22,alien.x,alien.y);
      state.alien=null;
      state.raidsCleared++;
      state.nextRaid=state.elapsed+Math.max(32,64-state.raidsCleared*4);
      say('Alien repelled.');
    }
    refresh();
    save();
  }

  function tick(dt) {
    if (!state.fish.length) return;
    state.elapsed+=dt;
    state.shotReady=Math.max(0,state.shotReady-dt);
    runAlien(dt);
    for (let i=state.pellets.length-1;i>=0;i--) {
      const p=state.pellets[i];
      p.age+=dt;
      p.y=Math.min(420,p.y+dt*20);
      if (p.age>=14) state.pellets.splice(i,1);
    }
    for (let i=state.fish.length-1;i>=0;i--) {
      const f=state.fish[i];
      f.energy=Math.max(0,f.energy-dt*1.5);
      if (f.energy===0 && hurt(f,dt*7)) {save();continue;}
      if (f.energy>=40) f.health=Math.min(100,f.health+dt*1.5);
      let meal, gap=Infinity;
      if (f.energy<82) {
        for (const pellet of state.pellets) {
          const d=distance(f,pellet);
          if (d<gap) {meal=pellet;gap=d;}
        }
      }
      if (meal && gap<=15) {
        const food=FOOD[meal.level];
        f.energy=Math.min(100,f.energy+food.energy);
        f.growth=Math.min(100,f.growth+food.growth);
        state.pellets.splice(state.pellets.indexOf(meal),1);
      } else if (meal) {
        const dx=meal.x-f.x;
        const ratio=Math.min(1,140*dt/gap);
        f.x=clamp(f.x+dx*ratio,38,922);
        f.y=clamp(f.y+(meal.y-f.y)*ratio,52,445);
        if (Math.abs(dx)>2) f.direction=Math.sign(dx);
      } else {
        f.x=clamp(f.x+f.direction*(43+f.kind*5+f.growth*.16)*dt,38,922);
        if (f.x===38 || f.x===922) f.direction=f.x===38?1:-1;
        f.y+=(220+Math.sin(animationTime*.6+f.phase)*104-f.y)*dt*.85;
      }
      if (f.energy>=25 && state.coins.length<32) {
        f.timer=Math.max(0,f.timer-dt);
        if (f.timer===0) {
          const grown=f.growth>=60;
          state.coins.push({x:f.x,y:f.y,age:0,value:grown?13:8});
          f.timer=(grown?8:12)+Math.random()*2;
        }
      }
    }
    for (let i=state.coins.length-1;i>=0;i--) {
      const c=state.coins[i];
      c.age+=dt;
      c.y=Math.min(445,c.y+dt*31);
      if (c.age>=COIN_LIFETIME) state.coins.splice(i,1);
    }
  }

  function ellipse(x,y,rx,ry,fill) {
    ctx.beginPath();
    ctx.ellipse(x,y,rx,ry,0,0,2*Math.PI);
    ctx.fillStyle=fill;
    ctx.fill();
  }

  function path(fill,points) {
    ctx.beginPath();
    ctx.moveTo(...points[0]);
    for (const point of points.slice(1)) ctx.lineTo(...point);
    ctx.closePath();
    ctx.fillStyle=fill;
    ctx.fill();
  }

  function curve(color,width,x,y,a,b,c,d,e,f) {
    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.bezierCurveTo(a,b,c,d,e,f);
    ctx.stroke();
  }

  const water=ctx.createLinearGradient(0,0,0,HEIGHT);
  water.addColorStop(0,'#237b8c');
  water.addColorStop(1,'#092a39');

  function drawHabitat() {
    ctx.fillStyle=water;
    ctx.fillRect(0,0,WIDTH,HEIGHT);
    for (let i=0;i<5;i++) {
      const x=-70+i*217+Math.sin(animationTime*.3+i)*14;
      path('#c8f8e717',[[x,0],[x+78,0],[x+233,399],[x+168,331]]);
    }
    for (const b of bubbles) {
      ctx.beginPath();
      ctx.arc(b.x+Math.sin(animationTime*.7+b.y)*7,(480+b.y-animationTime*(8+b.size)%480)%480,b.size,0,2*Math.PI);
      ctx.strokeStyle='#c7f6ef55';
      ctx.lineWidth=1;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(0,437);
    ctx.bezierCurveTo(215,404,330,467,520,432);
    ctx.bezierCurveTo(690,397,830,447,960,420);
    ctx.lineTo(960,HEIGHT);
    ctx.lineTo(0,HEIGHT);
    ctx.fillStyle='#335a62';
    ctx.fill();
    for (let i=0;i<85;i++) ellipse(12+i*121%939,453+i*57%35,1+i%4,1,'#9cd3c048');
    for (const [x,y,w] of [[119,444,109],[208,451,50],[802,439,126],[882,448,59]]) {
      path('#244653',[[x-w,y],[x-w*.69,y-37],[x-w*.32,y-55],[x+w*.28,y-44],[x+w*.69,y-22],[x+w,y]]);
      path('#3a6670',[[x-w*.69,y-37],[x-w*.32,y-55],[x+w*.28,y-44],[x+w*.04,y-27],[x-w*.48,y-21]]);
    }
    for (const x of [27,66,148,248,688,823,905,941]) {
      const lean=Math.sin(animationTime*.8+x)*13;
      curve('#45938c',4,x,451,x-19,421,x+23+lean,386,x+12+lean,354+x%25);
      curve('#64a69a',2,x,451,x+7,425,x-22-lean,407,x-19,394);
    }
  }

  function drawFish(f) {
    ctx.save();
    ctx.translate(f.x,f.y);
    const size=.66+f.growth*.005;
    ctx.scale(f.direction*size,size);
    const color=fishColors[f.kind];
    const wave=Math.sin(animationTime*8+f.phase)*6;
    path(color,[[-14,0],[-44+wave,-14],[-38+wave,0],[-44+wave,14]]);
    path(color,[[-14,-9],[-8,-24],[9,-11]]);
    ellipse(0,0,25,15,color);
    ellipse(-4,-6,15,5,'#fff8dc55');
    curve('#14495778',2.4,-10,-10,-3,-4,-5,6,-12,10);
    ellipse(13,-3,5,5,'#f3fbef');
    ellipse(15,-3,2.5,2.5,'#0b303b');
    ctx.restore();
    if (f.energy<55 || f.health<95) {
      ctx.fillStyle='#071923c9';
      ctx.fillRect(f.x-14,f.y+24,28,4);
      ctx.fillStyle=f.energy<23?'#f6a363':'#b4ebbd';
      ctx.fillRect(f.x-14,f.y+24,28*f.energy/100,4);
      if (f.health<95) {
        ctx.fillStyle='#071923c9';
        ctx.fillRect(f.x-14,f.y+30,28,3);
        ctx.fillStyle='#f18f9c';
        ctx.fillRect(f.x-14,f.y+30,28*f.health/100,3);
      }
    }
  }

  function drawFood(p) {
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.age*2);
    const color=FOOD[p.level].color;
    if (p.level===0) ellipse(0,0,3,3,color);
    else if (p.level===1) path(color,[[0,-5],[6,0],[0,4],[-6,1]]);
    else path(color,[[-5,-4],[5,-4],[5,4],[-5,4]]);
    ctx.restore();
  }

  function drawAlien(a) {
    const pulse=Math.sin(animationTime*5)*3;
    ctx.save();
    ctx.translate(a.x,a.y);
    ellipse(0,0,52+pulse,44+pulse,'#ad78f136');
    path('#795bc1',[[-41,0],[-27,-27],[21,-32],[43,-7],[23,24],[-22,25]]);
    path('#c1a3f2',[[-34,-1],[-20,-22],[18,-25],[26,-15],[11,0]]);
    ellipse(9,1,17,13,'#352456');
    ellipse(11,0,8,6,'#e2f9aa');
    ellipse(12,0,3,4,'#38285d');
    ellipse(-19,17,5,3,'#f4aeed');
    ellipse(22,15,5,3,'#f4aeed');
    ctx.fillStyle='#191529';
    ctx.fillRect(-24,-43,48,5);
    ctx.fillStyle='#ff9c91';
    ctx.fillRect(-24,-43,48*a.hp/a.maxHp,5);
    ctx.restore();
  }

  function draw() {
    drawHabitat();
    state.pellets.forEach(drawFood);
    state.fish.forEach(drawFish);
    for (const c of state.coins) {
      ctx.save();
      ctx.globalAlpha=clamp((COIN_LIFETIME-c.age)/2,.15,1);
      const gold=c.value>=13;
      const w=4+Math.abs(Math.sin(c.age*6))*5;
      ellipse(c.x,c.y,13,13,gold?'#f9cc5d35':'#d9e7ed35');
      ellipse(c.x,c.y,w,10,gold?'#eab14f':'#a3bec7');
      ellipse(c.x-1,c.y-1,w*.75,8,gold?'#ffdc79':'#e0edf0');
      ctx.restore();
    }
    if (state.alien && state.fish.length) drawAlien(state.alien);
    for (const effect of effects) {
      ctx.save();
      if (effect.type==='shot') {
        ctx.globalAlpha=Math.max(0,1-effect.age*4);
        curve('#ffe0a5',3,WIDTH-25,HEIGHT-15,WIDTH-25,HEIGHT-15,effect.x,effect.y,effect.x,effect.y);
        ellipse(effect.x,effect.y,11,11,'#ffecb5a0');
      } else {
        ctx.globalAlpha=1-effect.age;
        ctx.fillStyle=effect.color;
        ctx.font='bold 17px system-ui';
        ctx.textAlign='center';
        ctx.fillText(effect.text,effect.x,effect.y-18-effect.age*24);
      }
      ctx.restore();
    }
  }

  ui.tank.addEventListener('click',event => {
    const rect=ui.tank.getBoundingClientRect();
    const p={x:(event.clientX-rect.left)*WIDTH/rect.width,y:(event.clientY-rect.top)*HEIGHT/rect.height};
    if (state.alien && distance(state.alien,p)<=48) fire();
    else {
      const coin=state.coins.findIndex(c => distance(c,p)<=19);
      if (coin>=0) collect(coin);
      else dropFood(p.x,p.y);
    }
  });
  ui.tank.addEventListener('keydown',event => {
    if (event.code==='Space') dropFood(WIDTH/2,100);
    else if (event.key==='Enter') collect(0);
    else if (event.code==='KeyG') fire();
    else return;
    event.preventDefault();
  });
  ui.buy.addEventListener('click',() => {
    if (ui.buy.disabled) return;
    state.cash-=BUY_FISH;
    state.fish.push(makeFish(state.fish.length%3,8));
    refresh();
    save();
  });
  ui.upgrade.addEventListener('click',() => {
    if (ui.upgrade.disabled) return;
    state.cash-=FOOD[state.foodLevel].upgrade;
    state.foodLevel++;
    say(FOOD[state.foodLevel].label+' food equipped.');
    refresh();
    save();
  });
  ui.gun.addEventListener('click',fire);
  ui.save.addEventListener('click',() => save(true));
  ui.restart.addEventListener('click',() => {
    if (state.fish.length) return;
    state=freshTank();
    effects.length=0;
    say('New tank started.');
    refresh();
    save();
  });
  ui.fullscreen.addEventListener('click',async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await ui.game.requestFullscreen();
    } catch {say('Full screen is unavailable here. Try F11 in your browser.');}
  });
  document.addEventListener('fullscreenchange',() => {
    ui.fullscreen.textContent=document.fullscreenElement?'Exit full screen':'Full screen';
  });
  window.addEventListener('pagehide',() => save());
  document.addEventListener('visibilitychange',() => {if (document.hidden) save();});

  let previous=performance.now();
  function frame(now) {
    const dt=clamp((now-previous)/1000,0,.1);
    previous=now;
    if (!document.hidden) {
      animationTime+=dt;
      tick(dt);
      for (let i=effects.length-1;i>=0;i--) {
        effects[i].age+=dt;
        if (effects[i].age>=1) effects.splice(i,1);
      }
      refreshRaid();
      draw();
      untilSave-=dt;
      if (untilSave<=0) {untilSave=5;save();}
    }
    requestAnimationFrame(frame);
  }
  refresh();
  requestAnimationFrame(frame);
</script>
</html>
